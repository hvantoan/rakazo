appId: com.agentsassistance.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      AAS_ACTIVE_EMAIL: ${AAS_SCREENSHOT_EMAIL}
- openLink: "aas:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Cancel"
- openLink: "aas:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "aas:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "aas:///"
