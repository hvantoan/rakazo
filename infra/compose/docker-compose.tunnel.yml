# Cloudflare Tunnel overlay. Keeps local loopback access on
# 127.0.0.1:15273 while also serving a public hostname through a
# tunnel (e.g. cloudflared; see /etc/cloudflared/config.yml).
#
# Set the public hostname in .env first:
#   RAKAZO_PUBLIC_HOST=rakazo.example.com
#
# Usage:
#   docker compose \
#     -f infra/compose/docker-compose.yml \
#     -f infra/compose/docker-compose.selfhost.local.yml \
#     -f infra/compose/docker-compose.tunnel.yml \
#     up -d
services:
  api:
    environment:
      API_URL: https://${RAKAZO_PUBLIC_HOST:?Set RAKAZO_PUBLIC_HOST in .env}
      WEB_ORIGIN: https://${RAKAZO_PUBLIC_HOST}
      BETTER_AUTH_URL: https://${RAKAZO_PUBLIC_HOST}

  web:
    environment:
      API_PROXY_TARGET: http://api:13100
      RAKAZO_HOST: ${RAKAZO_PUBLIC_HOST}
      RAKAZO_ALLOWED_HOSTS: ${RAKAZO_PUBLIC_HOST}
    ports: !override ["127.0.0.1:15273:5173"]
